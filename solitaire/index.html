<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10151f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Solitaire" />
    <title>Solitaire</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310151f'/%3E%3Crect x='5' y='5' width='10' height='10' rx='2.5' fill='%234cc2b0'/%3E%3Crect x='17' y='5' width='10' height='10' rx='2.5' fill='%232f4a6b'/%3E%3Crect x='5' y='17' width='10' height='10' rx='2.5' fill='%232f4a6b'/%3E%3Crect x='17' y='17' width='10' height='10' rx='2.5' fill='%238e3fd0'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/base.css" />
    <link rel="stylesheet" href="../src/solitaire/solitaire.css" />
  </head>
  <body class="game-page solitaire">
    <header class="bar">
      <a class="btn back" href="../" aria-label="Back to all games">‹ Games</a>
      <h1>Solitaire</h1>
      <button class="btn" id="new" type="button">New game</button>
    </header>
    <main class="play" id="play">
      <section class="climb" id="climb">
        <div class="table" id="table" aria-label="The cards"></div>
      </section>
      <section class="desk">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="tools" id="tools">
          <button class="btn" id="undo" type="button">Undo</button>
          <button class="btn" id="hint" type="button">Show me a move</button>
          <button class="btn btn-primary" id="finish" type="button" hidden>Finish it</button>
          <button class="btn" id="backs" type="button">Card backs</button>
        </div>
      </section>
    </main>
    <div class="veil" id="chooser" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="chooser-title">
        <h2 id="chooser-title">New game</h2>
        <p id="chooser-text"></p>
        <div class="sizes">
          <button class="btn btn-primary" type="button" data-draw="1">Turn one card</button>
          <button class="btn btn-primary" type="button" data-draw="3">Turn three cards</button>
        </div>
        <div class="dialog-row">
          <button class="btn" id="restart" type="button">Start this deal over</button>
          <button class="btn" id="chooser-no" type="button">Keep playing</button>
        </div>
      </div>
    </div>
    <div class="veil" id="backbook" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="backs-title">
        <h2 id="backs-title">Card backs</h2>
        <p>Tap the back you want.</p>
        <div class="swatches" id="swatches"></div>
        <div class="dialog-row">
          <button class="btn btn-primary" id="backs-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <script type="module" src="../src/solitaire/main.ts"></script>
  </body>
</html>
