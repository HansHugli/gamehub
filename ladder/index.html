<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10151f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Word Ladder" />
    <title>Word Ladder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310151f'/%3E%3Crect x='5' y='5' width='10' height='10' rx='2.5' fill='%234cc2b0'/%3E%3Crect x='17' y='5' width='10' height='10' rx='2.5' fill='%232f4a6b'/%3E%3Crect x='5' y='17' width='10' height='10' rx='2.5' fill='%232f4a6b'/%3E%3Crect x='17' y='17' width='10' height='10' rx='2.5' fill='%238e3fd0'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/base.css" />
    <link rel="stylesheet" href="../src/ladder/ladder.css" />
  </head>
  <body class="game-page ladder">
    <header class="bar">
      <a class="btn back" href="../" aria-label="Back to all games">‹ Games</a>
      <h1>Word Ladder</h1>
      <button class="btn" id="new" type="button">New puzzle</button>
    </header>
    <main class="play" id="play">
      <section class="climb">
        <p class="goal" id="goal"></p>
        <div class="rungs" id="rungs" aria-label="Your ladder"></div>
      </section>
      <section class="desk">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="tools" id="tools">
          <button class="btn" id="undo" type="button">Back a step</button>
          <button class="btn" id="hint" type="button">Give me a step</button>
        </div>
        <div class="keys" id="keys" aria-label="Letters"></div>
        <div class="after" id="after" hidden>
          <button class="btn" id="shortest" type="button">Show a shortest ladder</button>
          <button class="btn btn-primary" id="next" type="button">Next puzzle</button>
        </div>
      </section>
    </main>
    <div class="veil" id="confirm" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">Leave this puzzle?</h2>
        <p id="confirm-text"></p>
        <div class="dialog-row">
          <button class="btn" id="confirm-no" type="button">Keep going</button>
          <button class="btn btn-primary" id="confirm-yes" type="button">New puzzle</button>
        </div>
      </div>
    </div>
    <script type="module" src="../src/ladder/main.ts"></script>
  </body>
</html>
